<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime Log</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>🎬 Anime Log</h1>
    <p>내가 본 애니를 기록하는 곳</p>

    <div class="stats">

      <div class="stat-card">
        <strong>0</strong>
        <span>전체</span>
      </div>

      <div class="stat-card">
        <strong>0</strong>
        <span>보는 중</span>
      </div>

      <div class="stat-card">
        <strong>0</strong>
        <span>완주</span>
      </div>

      <div class="stat-card">
        <strong>0</strong>
        <span>볼 예정</span>
      </div>

    </div>


    <div class="toolbar">

      <input
        type="text"
        placeholder="애니 검색"
      >

      <button id="addButton">
        + 애니 추가
      </button>

    </div>


    <!-- 장르 필터 -->

    <div class="genre-filter">

      <button
        class="genre-filter-button active"
        data-genre="전체">
        전체 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="액션">
        액션 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="판타지">
        판타지 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="로맨스">
        로맨스 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="코미디">
        코미디 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="드라마">
        드라마 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="SF">
        SF <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="스포츠">
        스포츠 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="일상">
        일상 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="미스터리">
        미스터리 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="공포">
        공포 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="학원">
        학원 <span class="genre-count">0</span>
      </button>

      <button
        class="genre-filter-button"
        data-genre="음악">
        음악 <span class="genre-count">0</span>
      </button>

    </div>


    <!-- 상태 필터 -->

    <div class="status-filter">

      <button
        class="status-filter-button active"
        data-status="전체">
        전체
      </button>

      <button
        class="status-filter-button"
        data-status="보는 중">
        보는 중
      </button>

      <button
        class="status-filter-button"
        data-status="완주">
        완주
      </button>

      <button
        class="status-filter-button"
        data-status="볼 예정">
        볼 예정
      </button>

      <button
        class="status-filter-button"
        data-status="중단">
        중단
      </button>

    </div>


    <!-- 즐겨찾기 필터 -->

    <div class="favorite-filter">

      <button
        class="favorite-filter-button"
        data-favorite="false">
        ☆ 즐겨찾기만 보기
      </button>

    </div>


    <!-- 정렬 -->

    <div class="sort-bar">

      <label for="sortSelect">
        정렬
      </label>

      <select id="sortSelect">

        <option value="recent">
          최근 추가순
        </option>

        <option value="title">
          제목순
        </option>

        <option value="year">
          제작년도순
        </option>

      </select>

    </div>


    <!-- 백업 / 복원 -->

    <div class="backup-buttons">

      <button id="backupButton">
        💾 백업하기
      </button>

      <button id="restoreButton">
        📂 복원하기
      </button>

      <input
        id="restoreInput"
        type="file"
        accept=".json,application/json"
        style="display: none;"
      >

    </div>


    <div class="anime-list">

      <div class="empty">
        아직 등록한 애니가 없어요.
      </div>

    </div>

  </div>


  <!-- 애니 추가/수정 창 -->

  <div class="modal" id="animeModal">

    <div class="modal-content">

      <div class="modal-header">

        <h2>애니 추가</h2>

        <button
          id="closeButton"
          class="close-button">
          ×
        </button>

      </div>


      <!-- 제목 -->

      <label>애니 제목</label>

      <input
        id="animeTitle"
        type="text"
        placeholder="예: 주술회전"
      >


      <!-- 제작년도 -->

      <label>제작년도</label>

      <input
        id="animeYear"
        type="number"
        placeholder="예: 2024"
        min="1900"
        max="2100"
      >


      <!-- 포스터 -->

      <label>포스터 이미지 주소</label>

      <input
        id="animePoster"
        type="text"
        placeholder="이미지 주소를 입력하세요"
      >


      <!-- 시즌 -->

      <label>몇 기</label>

      <input
        id="animeSeason"
        type="number"
        placeholder="예: 2"
        min="1"
        max="100"
      >


      <!-- 화수 -->

      <label>몇 화까지</label>

      <input
        id="animeEpisodes"
        type="number"
        placeholder="예: 24"
        min="1"
        max="9999"
      >


      <!-- 장르 -->

      <label>장르</label>

      <div class="genre-options">

        <label class="genre-option">
          <input
            type="checkbox"
            value="액션">
          <span>액션</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="판타지">
          <span>판타지</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="로맨스">
          <span>로맨스</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="코미디">
          <span>코미디</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="드라마">
          <span>드라마</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="SF">
          <span>SF</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="스포츠">
          <span>스포츠</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="일상">
          <span>일상</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="미스터리">
          <span>미스터리</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="공포">
          <span>공포</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="학원">
          <span>학원</span>
        </label>

        <label class="genre-option">
          <input
            type="checkbox"
            value="음악">
          <span>음악</span>
        </label>

      </div>


      <!-- 시청 상태 -->

      <label>시청 상태</label>

      <select id="animeStatus">

        <option value="볼 예정">
          볼 예정
        </option>

        <option value="보는 중">
          보는 중
        </option>

        <option value="완주">
          완주
        </option>

        <option value="중단">
          중단
        </option>

      </select>


      <!-- 즐겨찾기 -->

      <label class="favorite-option">

        <input
          id="animeFavorite"
          type="checkbox"
        >

        <span>⭐ 즐겨찾기</span>

      </label>


      <!-- 19세 -->

      <label class="adult-option">

        <input
          id="animeAdult"
          type="checkbox"
        >

        <span>🔞 19세</span>

      </label>


      <!-- 버튼 -->

      <div class="modal-buttons">

        <button
          id="cancelButton"
          class="cancel-button">
          취소
        </button>

        <button
          id="saveButton"
          class="save-button">
          추가하기
        </button>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
